<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <!-- 로그인 화면 왼쪽 그림 — SB Admin 2 원본의 외부 이미지(source.unsplash.com)는 서비스 종료로 열리지 않아 대체 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4e73df"/>
      <stop offset="1" stop-color="#1cc88a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- 배경 장식 원 -->
  <circle cx="520" cy="110" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="70" cy="700" r="190" fill="#ffffff" opacity="0.07"/>

  <!-- 과제 클립보드 -->
  <g transform="translate(300 330) rotate(-8)">
    <rect x="-120" y="-150" width="240" height="300" rx="22" fill="#ffffff" opacity="0.95"/>
    <rect x="-55" y="-172" width="110" height="46" rx="14" fill="#2e59d9"/>
    <rect x="-80" y="-80" width="160" height="14" rx="7" fill="#d1d3e2"/>
    <rect x="-80" y="-40" width="120" height="14" rx="7" fill="#d1d3e2"/>
    <rect x="-80" y="0" width="140" height="14" rx="7" fill="#d1d3e2"/>
    <circle cx="45" cy="80" r="44" fill="#1cc88a"/>
    <path d="M24 80 l15 15 l28 -32" fill="none" stroke="#ffffff" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="300" y="590" text-anchor="middle" fill="#ffffff"
        font-family="Nunito, 'Malgun Gothic', sans-serif" font-size="48" font-weight="800">AssignHub</text>
  <text x="300" y="640" text-anchor="middle" fill="#ffffff" opacity="0.9"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24">과제 제출 · 채점을 한 곳에서</text>
</svg>
