# 배포용 DB 접속 정보 예시 — 이 파일을 복사해 같은 폴더에 application-secret.yaml로 저장하고 값을 채운다
# application-secret.yaml은 .gitignore에 있어 깃허브에 올라가지 않고, bootJar로 만든 jar 안에만 들어간다
# Neon 대시보드 → Connect → Connection string에서 값 확인
#   postgresql://<사용자>:<비밀번호>@<호스트>/<DB이름>?sslmode=require
spring:
  datasource:
    url: jdbc:postgresql://<호스트>/<DB이름>?sslmode=require
    username: <사용자>
    password: <비밀번호>
