spring:
  application:
    name: assignhub

  # 배포용 DB 접속 정보(Neon 등)는 application-secret.yaml에 따로 둔다 — git에는 올리지 않고 jar에만 포함
  # 파일이 없으면 무시하고 아래 로컬 Docker DB 설정을 쓴다 (작성법: application-secret.example.yaml)
  config:
    import: optional:classpath:application-secret.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assignhub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true

  thymeleaf:
    cache: false

  # 첨부파일 용량 제한 (과제 I3 · 제출 S3)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    whitelabel:
      enabled: false
  tomcat:
    # 용량 초과 요청도 끝까지 읽어서 연결이 끊기지 않고 안내 메시지로 돌아가게
    max-swallow-size: -1

# U4 초기 강사 계정 (개발용 기본값, 운영에서는 환경변수로 덮어쓰기)
app:
  # 로그인 상태 유지(remember-me) 쿠키 서명 키 — 운영에서는 환경변수로 반드시 변경
  remember-me-key: ${REMEMBER_ME_KEY:assignhub-local-dev-remember-me-key}
  # 첨부파일 저장 폴더 (git에는 올리지 않음)
  upload-dir: ${UPLOAD_DIR:./uploads}
  instructor:
    email: ${INSTRUCTOR_EMAIL:instructor@test.com}
    password: ${INSTRUCTOR_PASSWORD:password123}
    name: ${INSTRUCTOR_NAME:stadmin}
