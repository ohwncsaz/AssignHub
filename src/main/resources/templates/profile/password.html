<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title>비밀번호 변경</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">비밀번호 변경</h1>
        <a th:href="@{/profile}" class="btn btn-sm btn-outline-secondary"
           sec:authorize="!principal.passwordChangeRequired">
            <i class="fas fa-arrow-left fa-sm mr-1"></i> 프로필
        </a>
    </div>

    <!-- 강사가 만든 계정의 첫 로그인 — 초기 비밀번호(학번)를 바꾸기 전에는 다른 화면으로 이동할 수 없다 -->
    <div class="alert alert-warning" sec:authorize="principal.passwordChangeRequired">
        <i class="fas fa-exclamation-triangle mr-1"></i>
        강사가 만든 계정으로 처음 로그인했습니다. 초기 비밀번호(학번)를 새 비밀번호로 변경해야 서비스를 이용할 수 있습니다.
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form th:action="@{/profile/password}" th:object="${passwordChangeForm}" method="post" novalidate>
                        <div class="form-group">
                            <label for="currentPassword" class="font-weight-bold">현재 비밀번호</label>
                            <input type="password" th:field="*{currentPassword}" class="form-control"
                                   th:errorclass="is-invalid" autocomplete="current-password">
                            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="form-group">
                            <label for="newPassword" class="font-weight-bold">새 비밀번호</label>
                            <input type="password" th:field="*{newPassword}" class="form-control"
                                   th:errorclass="is-invalid" autocomplete="new-password" placeholder="8자 이상">
                            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                        </div>
                        <div class="form-group">
                            <label for="newPasswordConfirm" class="font-weight-bold">새 비밀번호 확인</label>
                            <input type="password" th:field="*{newPasswordConfirm}" class="form-control"
                                   th:errorclass="is-invalid" autocomplete="new-password">
                            <div class="invalid-feedback" th:errors="*{newPasswordConfirm}"></div>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="btn btn-primary">변경</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
