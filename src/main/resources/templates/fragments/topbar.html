<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="topbar" class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
        <i class="fa fa-bars"></i>
    </button>

    <ul class="navbar-nav ml-auto">
        <!-- principal.name은 LoginUser.getName() — 비로그인(익명) 상태에서는 렌더링하지 않음 -->
        <li class="nav-item dropdown no-arrow" sec:authorize="isAuthenticated()">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small">
                    <span sec:authentication="principal.name">사용자</span>
                    <span class="badge badge-primary ml-1" sec:authorize="hasRole('INSTRUCTOR')">강사</span>
                    <span class="badge badge-success ml-1" sec:authorize="hasRole('STUDENT')">학생</span>
                </span>
                <!-- 프로필 사진이 있으면 사진, 없으면 기본 아이콘 (v=경로 해시: 사진을 바꾸면 캐시 갱신) -->
                <th:block th:with="imagePath=${#authentication.principal.profileImagePath}">
                    <img th:if="${imagePath != null}" class="img-profile rounded-circle" style="object-fit: cover"
                         th:src="@{/profile/image(v=${imagePath.hashCode()})}" alt="프로필 사진">
                    <i th:if="${imagePath == null}" class="fas fa-user-circle fa-2x text-gray-400"></i>
                </th:block>
            </a>
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                <span class="dropdown-item-text small text-gray-500" sec:authentication="principal.email"></span>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" th:href="@{/profile}">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                    프로필
                </a>
                <a class="dropdown-item" th:href="@{/profile/password}">
                    <i class="fas fa-key fa-sm fa-fw mr-2 text-gray-400"></i>
                    비밀번호 변경
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                    로그아웃
                </a>
            </div>
        </li>
    </ul>
</nav>

</html>
