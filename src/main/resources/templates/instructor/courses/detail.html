<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${course.name}">강좌 상세</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800" th:text="${course.name}">강좌명</h1>
        <a th:href="@{/instructor/courses}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left fa-sm mr-1"></i> 강좌 목록
        </a>
    </div>

    <div class="row">
        <!-- 참여코드: 학생이 S1 수강 등록에서 입력 -->
        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-success text-uppercase mb-2">참여코드</div>
                    <div class="d-flex align-items-center">
                        <span id="joinCode" class="h3 mb-0 font-weight-bold text-gray-800 mr-3"
                              style="letter-spacing: 0.15em" th:text="${course.joinCode}">ABCD2345</span>
                        <button type="button" id="copyJoinCode" class="btn btn-sm btn-outline-success">
                            <i class="fas fa-copy fa-sm"></i> 복사
                        </button>
                    </div>
                    <div class="small text-gray-500 mt-2">학생은 [수강 등록] 메뉴에서 이 코드를 입력합니다.</div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-2">개설일시</div>
                    <div class="h5 mb-0 text-gray-800"
                         th:text="${#temporals.format(course.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-30 10:00</div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-6 mb-4">
            <a href="#students" class="text-decoration-none">
                <div class="card border-left-info shadow h-100 py-2">
                    <div class="card-body">
                        <div class="text-xs font-weight-bold text-info text-uppercase mb-2">수강생</div>
                        <div class="h5 mb-0 text-gray-800"><span th:text="${#lists.size(enrollments)}">0</span>명</div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- I3 과제 목록 · 등록 · 수정 · 삭제 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex align-items-center justify-content-between">
            <h6 class="m-0 font-weight-bold text-primary">
                과제 <span class="badge badge-primary ml-1" th:text="${#lists.size(assignments)}">0</span>
            </h6>
            <a th:href="@{/instructor/assignments/new(courseId=${course.id})}" class="btn btn-sm btn-primary">
                <i class="fas fa-plus fa-sm mr-1"></i> 과제 등록
            </a>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(assignments)}" class="text-center text-gray-500 py-4">
                등록된 과제가 없습니다.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(assignments)}">
                <table class="table table-bordered align-middle">
                    <thead>
                    <tr>
                        <th style="width: 80px">상태</th>
                        <th>제목</th>
                        <th style="width: 300px">제출 기간</th>
                        <th style="width: 70px">배점</th>
                        <th style="width: 140px">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${assignments}">
                        <td class="text-center">
                            <span class="badge" th:classappend="'badge-' + ${a.status.badge}"
                                  th:text="${a.status.label}">진행중</span>
                        </td>
                        <td>
                            <span th:text="${a.title}">과제 제목</span>
                            <a th:if="${a.filePath != null}" th:href="@{/instructor/assignments/{id}/file(id=${a.id})}"
                               class="ml-1 text-gray-500" th:title="${a.fileName}">
                                <i class="fas fa-paperclip fa-sm"></i>
                            </a>
                        </td>
                        <td class="small">
                            <span th:text="${#temporals.format(a.startAt, 'yyyy-MM-dd HH:mm')}">시작</span>
                            ~
                            <span th:text="${#temporals.format(a.endAt, 'yyyy-MM-dd HH:mm')}">종료</span>
                        </td>
                        <td class="text-center" th:text="${a.maxScore}">100</td>
                        <td class="text-center text-nowrap">
                            <a th:href="@{/instructor/assignments/{id}/edit(id=${a.id})}"
                               class="btn btn-sm btn-outline-primary">수정</a>
                            <form th:action="@{/instructor/assignments/{id}/delete(id=${a.id})}" method="post"
                                  class="d-inline" onsubmit="return confirm('과제를 삭제할까요? 되돌릴 수 없습니다.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- I2 수강생 목록 -->
    <div class="card shadow mb-4" id="students">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                수강생 <span class="badge badge-info ml-1" th:text="${#lists.size(enrollments)}">0</span>
            </h6>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(enrollments)}" class="text-center text-gray-500 py-4">
                아직 등록한 학생이 없습니다. 참여코드를 학생들에게 공유하세요.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(enrollments)}">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th style="width: 60px">No</th>
                        <th style="width: 140px">학번</th>
                        <th style="width: 140px">이름</th>
                        <th>이메일</th>
                        <th style="width: 180px">등록일시</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="e, stat : ${enrollments}">
                        <td class="text-center" th:text="${stat.count}">1</td>
                        <td th:text="${e.student.studentNo}">20260001</td>
                        <td th:text="${e.student.name}">홍길동</td>
                        <td th:text="${e.student.email}">hong@test.com</td>
                        <td th:text="${#temporals.format(e.joinedAt, 'yyyy-MM-dd HH:mm')}">2026-10-07 10:00</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
    <script>
        $('#copyJoinCode').on('click', function () {
            const code = $('#joinCode').text().trim();
            navigator.clipboard.writeText(code).then(() => {
                $(this).html('<i class="fas fa-check fa-sm"></i> 복사됨');
                setTimeout(() => $(this).html('<i class="fas fa-copy fa-sm"></i> 복사'), 1500);
            });
        });
    </script>
</th:block>
</body>
</html>
