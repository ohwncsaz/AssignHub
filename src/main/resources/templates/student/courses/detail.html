<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${enrollment.course.name}">강좌</title>
</head>
<body>
<div layout:fragment="content" th:with="course=${enrollment.course}">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800" th:text="${course.name}">강좌명</h1>
        <a th:href="@{/student/courses}" class="btn btn-sm btn-outline-secondary mt-2 mt-sm-0">
            <i class="fas fa-arrow-left fa-sm mr-1"></i> 내 강좌
        </a>
    </div>

    <div class="row">
        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">강사</div>
                    <div class="h5 mb-0 text-gray-800" th:text="${course.instructor.name}">강사</div>
                </div>
            </div>
        </div>
        <div class="col-xl-4 col-md-6 mb-4">
            <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">수강 등록일</div>
                    <div class="h5 mb-0 text-gray-800"
                         th:text="${#temporals.format(enrollment.joinedAt, 'yyyy-MM-dd')}">2026-10-07</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 이 강좌의 과제 (정렬: 진행중 → 예정 → 마감) -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                과제 <span class="badge badge-primary ml-1" th:text="${#lists.size(assignments)}">0</span>
            </h6>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(assignments)}" class="text-center text-gray-500 py-4">
                아직 등록된 과제가 없습니다.
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(assignments)}">
                <table class="table table-bordered table-hover">
                    <thead>
                    <tr>
                        <th>상태</th>
                        <th>제출</th>
                        <th class="col-main">과제</th>
                        <th>제출 기간</th>
                        <th>배점</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${assignments}" th:classappend="${a.closingSoon} ? 'table-warning'">
                        <td class="text-nowrap">
                            <th:block th:replace="~{fragments/assignment :: statusBadge(${a})}"></th:block>
                        </td>
                        <td class="text-nowrap">
                            <th:block th:replace="~{fragments/assignment :: submissionBadge(${submissionStatus.get(a.id)})}"></th:block>
                        </td>
                        <td>
                            <a th:href="@{/student/assignments/{id}(id=${a.id})}" th:text="${a.title}">과제 제목</a>
                            <i th:if="${a.filePath != null}" class="fas fa-paperclip fa-sm text-gray-500 ml-1"></i>
                        </td>
                        <td class="small">
                            <th:block th:replace="~{fragments/assignment :: period(${a})}"></th:block>
                        </td>
                        <td class="text-center" th:text="${a.maxScore}">100</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
