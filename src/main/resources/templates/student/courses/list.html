<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>내 강좌</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">내 강좌</h1>
        <a th:href="@{/student/courses/join}" class="btn btn-sm btn-success mt-2 mt-sm-0">
            <i class="fas fa-key fa-sm mr-1"></i> 참여코드로 수강 등록
        </a>
    </div>

    <div th:if="${#lists.isEmpty(cards)}" class="card shadow mb-4">
        <div class="card-body text-center text-gray-500 py-5">
            <p class="mb-2">아직 수강 중인 강좌가 없습니다.</p>
            <a th:href="@{/student/courses/join}" class="small">강사에게 받은 참여코드로 수강 등록하기 &rarr;</a>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-4 col-md-6 mb-4" th:each="card : ${cards}">
            <!-- 카드 전체가 강좌 상세 링크 -->
            <a th:href="@{/student/courses/{id}(id=${card.enrollment.course.id})}" class="text-decoration-none">
                <div class="card shadow h-100"
                     th:classappend="${card.closingSoon > 0} ? 'border-left-danger' : 'border-left-primary'">
                    <div class="card-body">
                        <div class="h5 font-weight-bold text-gray-800 mb-1" th:text="${card.enrollment.course.name}">강좌명</div>
                        <div class="small text-gray-600 mb-3">
                            <i class="fas fa-chalkboard-teacher fa-sm mr-1"></i>
                            <span th:text="${card.enrollment.course.instructor.name}">강사</span>
                        </div>
                        <div>
                            <span class="badge badge-light mr-1">과제 <span th:text="${card.total}">0</span></span>
                            <span class="badge badge-success mr-1" th:if="${card.open > 0}">
                                진행중 <span th:text="${card.open}">0</span>
                            </span>
                            <span class="badge badge-danger" th:if="${card.closingSoon > 0}">
                                마감 임박 <span th:text="${card.closingSoon}">0</span>
                            </span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>

</div>
</body>
</html>
