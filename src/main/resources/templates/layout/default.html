<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title layout:title-pattern="$CONTENT_TITLE - AssignHub">AssignHub</title>
    <th:block th:replace="~{fragments/assets :: styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">

    <ul th:replace="~{fragments/sidebar :: sidebar}"></ul>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <nav th:replace="~{fragments/topbar :: topbar}"></nav>

            <div class="container-fluid">
                <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>
                <div layout:fragment="content"></div>
            </div>

        </div>

        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>AssignHub &copy; 2026</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<a class="scroll-to-top rounded" href="#page-top"><i class="fas fa-angle-up"></i></a>

<!-- 로그아웃은 CSRF 토큰이 필요한 POST 요청 -->
<div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="logoutModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="logoutModalLabel">로그아웃 하시겠습니까?</h5>
                <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">현재 세션을 종료하고 로그인 화면으로 이동합니다.</div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" data-dismiss="modal">취소</button>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-primary">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
